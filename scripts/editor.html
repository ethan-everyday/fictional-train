<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seven Nights — Story Editor</title>
<style>
  @font-face { font-family: "Cinzel"; src: url("/fonts/Cinzel-Variable.ttf") format("truetype");
    font-weight: 400 900; font-display: swap; }
  @font-face { font-family: "IM Fell English"; src: url("/fonts/IMFellEnglish-Regular.ttf") format("truetype");
    font-style: normal; font-display: swap; }
  @font-face { font-family: "IM Fell English"; src: url("/fonts/IMFellEnglish-Italic.ttf") format("truetype");
    font-style: italic; font-display: swap; }
  :root {
    --night: #0f0b07; --oak: #26190f; --bark: #46351f; --bark2: #604b2e;
    --p100: #f2e8ce; --p300: #dcc99f; --p400: #c3aa7d; --p500: #9d8459; --p600: #7c6845;
    --gold: #d4a937; --gold-dim: #a8842c; --amber: #f59e0b; --red: #ef4444; --green: #34d399; --blue: #60a5fa;
    --display: "Cinzel", Georgia, serif;
    --prose: "IM Fell English", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--night); color: var(--p100);
    font: 14px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; }
  h1, h2, h3 { font-family: var(--display); font-weight: 600; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--oak); border-bottom: 1px solid var(--bark);
    box-shadow: 0 1px 0 rgba(212,169,55,.12); position: sticky; top: 0; z-index: 10; }
  header h1 { margin: 0; font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  .tabs { display: flex; gap: 6px; }
  .tab { font-family: var(--display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    padding: 7px 14px; border: 1px solid var(--bark2); border-radius: 7px;
    background: var(--night); color: var(--p300); cursor: pointer; }
  .tab:hover { border-color: var(--gold-dim); }
  .tab.active { background: var(--amber); color: var(--night); border-color: var(--amber); font-weight: 700; }
  .spacer { flex: 1; }
  button { font: inherit; cursor: pointer; }
  .btn { padding: 6px 14px; border-radius: 7px; border: 1px solid var(--bark2);
    background: var(--night); color: var(--p100); }
  .btn:hover { border-color: var(--amber); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { font-family: var(--display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    background: var(--amber); color: var(--night); border-color: rgba(252,211,77,.5); font-weight: 700; }
  .btn.primary:hover { background: #fbbf24; }
  .btn.danger { color: var(--red); border-color: #6b1d1d; }
  .btn:disabled { opacity: .4; cursor: default; transform: none; }
  #status { font-size: 13px; }
  .ok { color: var(--green); } .err { color: var(--red); }

  #view { padding: 14px; }

  /* map */
  #map-wrap { overflow: auto; border: 1px solid var(--bark); border-radius: 10px; background: #140d07; }
  .filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 10px; }
  .filterbar select { width: auto; padding: 5px 6px; font-size: 12px; }
  .fsearch { width: 210px !important; font-size: 12px; }
  .fchip { padding: 4px 9px; border-radius: 7px; border: 1px solid var(--bark2); background: var(--night);
    color: var(--p400); font-size: 12px; cursor: pointer; }
  .fchip.on { background: var(--bark); color: var(--p100); border-color: var(--amber); }
  #fcount { font-size: 11px; }
  .node.dim { opacity: 0.18; }
  .node.draft rect { stroke: var(--amber); stroke-dasharray: 4 3; }
  .bdg { font-size: 9px; font-family: Consolas, monospace; }
  .sv-green { fill: var(--green); } .sv-blue { fill: var(--blue); } .sv-gold { fill: var(--gold); }
  .sv-dim { fill: var(--p500); } .sv-neg { fill: var(--green); } .sv-pos { fill: var(--red); }
  /* the inspector strip as a parchment info bar — the same colour variables,
     re-pitched for ink on vellum, so the inline styles inside just work */
  #inspector { border: 1px solid var(--bark); border-radius: 8px;
    background: linear-gradient(#f2e8ce, #dcc99f);
    --p100: #241708; --p300: #3a2812; --p400: #4a3418; --p500: #6b5330; --p600: #8a7455;
    --gold: #8a6410; --green: #166534; --red: #b91c1c;
    color: #241708; padding: 8px 13px; margin: 0 0 10px; font-size: 12px; min-height: 48px;
    box-shadow: 0 1px 0 rgba(242,232,206,.12) inset, 0 4px 12px rgba(0,0,0,.35); }
  #inspector .flag { color: var(--gold); font-family: monospace; }
  #inspector .neg { color: var(--green); } #inspector .pos { color: var(--red); }
  #inspector .prose { color: var(--p500); font-style: italic; font-family: var(--prose); }

  /* modals */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 50;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 8vh; }
  .modal { background: var(--oak); border: 1px solid var(--bark2); border-radius: 12px;
    padding: 16px 18px; width: 540px; max-height: 80vh; overflow: auto; }
  .modal h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--gold); font-family: var(--display); }
  #drafts { font-size: 12px; color: var(--amber); cursor: pointer; }
  details.gate { border: 1px solid var(--bark2); border-radius: 8px; padding: 8px 10px; margin-top: 12px; }
  details.gate summary { cursor: pointer; font-size: 12px; list-style-position: inside; }
  details.gate summary .gsum { color: var(--p300); }
  #status.err { cursor: pointer; text-decoration: underline dotted; }
  #problems { position: fixed; top: 46px; right: 16px; z-index: 60; background: var(--oak);
    border: 1px solid var(--bark2); border-radius: 10px; padding: 8px 12px; max-width: 460px;
    max-height: 60vh; overflow: auto; }
  #problems div { font-size: 12px; color: var(--red); padding: 3px 0; cursor: pointer; }
  #problems div:hover { color: var(--p100); }
  .node { cursor: pointer; }
  .node rect { fill: var(--oak); stroke: var(--bark2); rx: 8; transition: stroke .12s, fill .12s; }
  .node:hover rect { stroke: var(--amber); fill: #2d1f11; }
  .node.sel rect { stroke: var(--amber); stroke-width: 2; fill: #33240f; }
  .node text { fill: var(--p100); font-size: 11px; }
  .node .sub { fill: var(--p500); font-size: 9px; }
  .col-head { fill: var(--gold); font-family: var(--display); font-size: 11px;
    letter-spacing: .25em; text-transform: uppercase; }

  /* edit */
  .edit-grid { display: grid; grid-template-columns: 260px 1fr 280px; gap: 16px; align-items: start; }
  .panel { border: 1px solid var(--bark); border-radius: 10px; background: var(--oak); padding: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--p400); }
  .loc-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .loc-tab { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 7px;
    border: 1px solid var(--bark2); background: var(--night); color: var(--p400); font-size: 12px; cursor: pointer; }
  .loc-tab:hover { border-color: var(--gold-dim); }
  .loc-tab.active { background: var(--bark); color: var(--p100); border-color: var(--amber); }
  .loc-tab .swatch { width: 12px; height: 12px; border-radius: 50%; flex: none;
    background-size: cover; background-position: center; border: 1px solid var(--bark2); }
  .loc-tab.active .swatch { border-color: var(--amber); }
  .evlist { display: flex; flex-direction: column; gap: 4px; max-height: 60vh; overflow: auto; }
  .evrow { padding: 6px 8px; border-radius: 7px; border: 1px solid transparent; background: var(--night);
    cursor: pointer; font-size: 12px; }
  .evrow:hover { border-color: var(--bark2); }
  .evrow.sel { border-color: var(--amber); background: #33240f; }
  .evrow .tag { font-size: 9px; padding: 1px 5px; border-radius: 5px; margin-left: 6px; }
  .tag.effect { background: #243; color: var(--green); }
  .tag.check { background: #234; color: var(--blue); }
  .tag.choices { background: #432; color: var(--gold); }

  label { display: block; font-size: 12px; color: var(--p400); margin: 10px 0 3px; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 6px 8px; background: var(--night); color: var(--p100);
    border: 1px solid var(--bark2); border-radius: 7px; font: inherit; }
  textarea { min-height: 54px; resize: vertical; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .stats-grid label { margin: 0 0 2px; text-align: center; font-size: 10px; }
  .stats-grid input { padding: 4px; text-align: center; }
  .threats-grid { grid-template-columns: repeat(4, 1fr); }
  .threats-grid input::placeholder { color: var(--p600); }
  .flagbox { max-height: 130px; overflow: auto; border: 1px solid var(--bark2); border-radius: 7px; padding: 6px; }
  .flagbox label { display: flex; align-items: center; gap: 6px; margin: 2px 0; color: var(--p300); }
  .flagbox input { width: auto; }
  .addflag { display: flex; gap: 6px; margin-top: 6px; }
  .addflag input { flex: 1; }
  .branch { border: 1px solid var(--bark2); border-radius: 8px; padding: 10px; margin-top: 8px; }
  .branch h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--gold); }
  .conn { font-size: 12px; }
  .conn .flag { color: var(--gold); font-family: monospace; }
  .conn ul { margin: 2px 0 10px; padding-left: 16px; color: var(--p400); }
  .muted { color: var(--p600); }
  .errlist { margin: 0; padding-left: 18px; color: var(--red); font-size: 12px; }
  .tchip { font-size: 9px; padding: 1px 4px; border-radius: 5px; margin-left: 4px; font-family: monospace; }
  .tchip.neg { background: #10251a; color: var(--green); }
  .tchip.pos { background: #2b1212; color: var(--red); }
  .budget { width: 100%; border-collapse: collapse; font-size: 12px; }
  .budget th, .budget td { padding: 4px 6px; text-align: right; border-bottom: 1px solid rgba(70,53,31,.6); }
  .budget th { font-family: var(--display); font-weight: 600; font-size: 10px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--p500); border-bottom: 1px solid rgba(212,169,55,.35); }
  .budget td:first-child { font-family: var(--display); font-size: 11px; letter-spacing: .08em; color: var(--p300); }
  .budget tr:last-child td { border-bottom: none; }
  .budget th:first-child, .budget td:first-child { text-align: left; }
  .budget .neg { color: var(--green); } .budget .pos { color: var(--red); }
  #backup-wrap { display: none; align-items: center; gap: 6px; }
  #backup-wrap select { padding: 5px 6px; background: var(--night); color: var(--p300);
    border: 1px solid var(--bark2); border-radius: 8px; font: inherit; font-size: 12px; max-width: 210px; }
  .odds { font-size: 11px; color: var(--p500); align-self: center; padding-top: 14px; }
</style>
</head>
<body>
<header>
  <h1>Seven Nights · Story Editor</h1>
  <div class="tabs">
    <button class="tab active" data-view="map">Map</button>
    <button class="tab" data-view="edit">Edit</button>
    <button class="tab" data-view="origins">Origins</button>
  </div>
  <div class="spacer"></div>
  <span id="drafts" style="display:none"></span>
  <span id="backup-wrap">
    <select id="backup-list" title="Snapshots taken automatically before every save"></select>
    <button class="btn" id="restore">Restore</button>
  </span>
  <span id="status"></span>
  <button class="btn primary" id="save" disabled title="Ctrl+S">Save</button>
</header>
<div id="view"></div>

<script>
const STATE = {
  data: null, view: "map", loc: "tavern", sel: null, dirty: false,
  filters: { chain: null, locs: new Set(), threat: null, threatMode: "any", week: null, q: "" },
  gateOpen: false,
};
const LOCS = ["church","tavern","market","farms","castle","slums","docks"];
const LOC_NAMES = { church:"Church", tavern:"Tavern", market:"Market", farms:"Farms", castle:"Castle", slums:"Slums", docks:"Docks" };
// Display names come from each location's meta block when present.
function locName(loc) {
  const m = STATE.data && STATE.data.locations[loc] && STATE.data.locations[loc].meta;
  return (m && m.name) || LOC_NAMES[loc];
}
const THREATS = ["plague","starvation","war","devils"];
const THREAT_NAMES = { plague:"Plague", starvation:"Starve", war:"War", devils:"Devils" };

// ---- helpers ----
function el(tag, props = {}, ...kids) {
  const n = document.createElementNS(props.ns || "http://www.w3.org/1999/xhtml", tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "ns") continue;
    if (k === "class") n.setAttribute("class", v);
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return n;
}
const svg = (tag, props, ...kids) => el(tag, { ...props, ns: "http://www.w3.org/2000/svg" }, ...kids);

function allEvents() { return LOCS.flatMap(l => STATE.data.locations[l].events.map(e => ({ ...e }))); }
function locEvents(loc) { return STATE.data.locations[loc].events; }
function locActs(loc) { return STATE.data.locations[loc].activities; }
function shapeOf(ev) { return ev.choices && ev.choices.length ? "choices" : ev.check ? "check" : "effect"; }
function choiceShapeOf(c) { return c.random ? "random" : c.check ? "check" : "effect"; }
/** Every effect a single choice can resolve to, whatever its shape. */
function choiceBranchesOf(c) {
  if (c.random) return (Array.isArray(c.random) ? c.random : []).map(r => r.effect).filter(Boolean);
  if (c.check) return [c.pass, c.fail].filter(Boolean);
  return c.effect ? [c.effect] : [];
}
function branchesOf(ev) {
  if (ev.choices) return ev.choices.flatMap(choiceBranchesOf);
  if (ev.check) return [ev.pass, ev.fail].filter(Boolean);
  return ev.effect ? [ev.effect] : [];
}
function setterFlags(ev) { return branchesOf(ev).flatMap(b => b.flags || []); }
function producibleFlags() {
  const s = new Set();
  const o = STATE.data.origins || {};
  for (const orig of [...(o.roles||[]), ...(o.backgrounds||[])]) if (orig.startFlag) s.add(orig.startFlag);
  for (const ev of allEvents()) setterFlags(ev).forEach(f => s.add(f));
  return s;
}
function allFlags() {
  const s = producibleFlags();
  for (const ev of allEvents()) { (ev.requires||[]).forEach(f=>s.add(f)); (ev.forbids||[]).forEach(f=>s.add(f)); }
  return [...s].sort();
}
/** Per threat: the event's single best relief and worst aggravation across branches. */
function threatMarks(ev) {
  const marks = {};
  for (const b of branchesOf(ev)) for (const [t, v] of Object.entries(b.threats || {})) {
    marks[t] = marks[t] || { neg: 0, pos: 0 };
    if (v < 0) marks[t].neg = Math.min(marks[t].neg, v);
    if (v > 0) marks[t].pos = Math.max(marks[t].pos, v);
  }
  return marks;
}
function threatChips(ev) {
  return Object.entries(threatMarks(ev)).flatMap(([t, m]) => [
    m.neg ? el("span", { class: "tchip neg" }, `${THREAT_NAMES[t][0]}${m.neg}`) : null,
    m.pos ? el("span", { class: "tchip pos" }, `${THREAT_NAMES[t][0]}+${m.pos}`) : null,
  ]);
}

/** Drafts: skeletons created by the quick-add flows carry "[draft]" in their
 * prose. They pass validation (so nothing blocks) but stay visibly unfinished
 * until the marker is written out. */
function isDraft(ev) {
  const hit = s => (s || "").includes("[draft]");
  return hit(ev.text)
    || branchesOf(ev).some(b => hit(b.text) || hit(b.outcome))
    || (ev.choices || []).some(c => hit(c.label));
}
function draftEvents() { return allEvents().filter(isDraft); }

// ---- modals + quick creation ----

function closeModal() {
  const ov = document.getElementById("overlay");
  if (ov) ov.remove();
}
function showModal(content) {
  closeModal();
  document.body.appendChild(el("div", {
    class: "overlay", id: "overlay",
    onclick: e => { if (e.target.id === "overlay") closeModal(); },
  }, el("div", { class: "modal" }, content)));
}

function slugify(s, fallback) {
  return (s.trim() || fallback).toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || fallback;
}

const draftEffect = (line) => ({ text: `[draft] ${line}`, outcome: "[draft] did something notable." });
const TEMPLATES = {
  flat:   { name: "Flat outcome", make: () => ({ effect: draftEffect("It plays out simply.") }) },
  check:  { name: "Hidden check", make: () => ({ check: { stat: "will", dc: 4 },
              pass: draftEffect("They rise to it."), fail: draftEffect("It goes badly.") }) },
  choice: { name: "Choice", make: () => ({ choices: [
              { label: "[draft] First path", effect: draftEffect("The first road taken.") },
              { label: "[draft] Second path", effect: draftEffect("The second road taken.") } ] }) },
  moral:  { name: "Moral choice", make: id => ({ choices: [
              { label: "[draft] Do the right thing", effect: { ...draftEffect("Virtue, at a price."), flags: [`${id}_stood`] } },
              { label: "[draft] Look to yourself", effect: { ...draftEffect("Survival first."), flags: [`${id}_turned`] } } ] }) },
  gamble: { name: "Gamble", make: () => ({ choices: [
              { label: "[draft] Stake your coin", random: [
                { weight: 1, effect: { ...draftEffect("Fortune smiles."), stats: { wealth: 1 } } },
                { weight: 1, effect: { ...draftEffect("Fortune spits."), stats: { wealth: -1 } } } ] },
              { label: "[draft] Keep your purse shut", effect: draftEffect("Wisdom, of a kind.") } ] }) },
};

function newEventModal() {
  let template = "flat";
  const locSel = el("select", {}, ...LOCS.map(l =>
    el("option", { value: l, selected: STATE.loc === l ? true : false }, locName(l))));
  const title = el("input", { type: "text", placeholder: "a rumour about the steward" });
  const chipRow = el("div", { class: "row", style: "margin-top:4px" });
  Object.entries(TEMPLATES).forEach(([k, t]) => chipRow.appendChild(
    el("button", { class: "btn" + (k === template ? " primary" : ""), onclick: e => {
      template = k;
      chipRow.querySelectorAll("button").forEach(b => b.classList.remove("primary"));
      e.target.classList.add("primary");
    } }, t.name)));
  const create = () => {
    const loc = locSel.value;
    const slug = slugify(title.value, "new_event");
    let id = `${loc}_${slug}`, n = 2;
    while (allEvents().some(e => e.id === id)) id = `${loc}_${slug}_${n++}`;
    const ev = { id, location: loc, activities: [],
      text: `[draft] ${title.value.trim() || "Something happens."}`, ...TEMPLATES[template].make(id) };
    locEvents(loc).push(ev);
    closeModal();
    STATE.loc = loc; STATE.sel = id; STATE.view = "edit";
    markDirty(); render();
    const ta = document.querySelector(".edit-grid textarea");
    if (ta) { ta.focus(); ta.select(); }
  };
  title.addEventListener("keydown", e => { if (e.key === "Enter") create(); });
  showModal(el("div", {},
    el("h2", {}, "New event"),
    el("div", { class: "row" },
      el("div", { style: "flex:0 0 130px" }, el("label", {}, "Location"), locSel),
      el("div", {}, el("label", {}, "Working title (becomes the id)"), title)),
    el("label", {}, "Shape"),
    chipRow,
    el("div", { style: "margin-top:14px;display:flex;justify-content:flex-end;gap:8px" },
      el("button", { class: "btn", onclick: closeModal }, "Cancel"),
      el("button", { class: "btn primary", onclick: create }, "Create draft"))));
  title.focus();
}

function newStorylineModal() {
  const blankBeat = () => ({ loc: STATE.loc, premise: "", week: "" });
  const beats = [blankBeat(), blankBeat()];
  const name = el("input", { type: "text", placeholder: "smuggler_debt" });
  const slugOf = () => slugify(name.value, "storyline");
  const rows = el("div", {});
  const rebuild = () => {
    rows.innerHTML = "";
    beats.forEach((b, i) => {
      rows.appendChild(el("div", { class: "row", style: "margin-top:6px" },
        el("div", { style: "flex:0 0 110px" }, el("select", { onchange: e => { b.loc = e.target.value; } },
          ...LOCS.map(l => el("option", { value: l, selected: b.loc === l ? true : false }, locName(l))))),
        el("div", {}, el("input", { type: "text", placeholder: `beat ${i + 1} premise…`, value: b.premise,
          oninput: e => { b.premise = e.target.value; } })),
        el("div", { style: "flex:0 0 64px" }, el("input", { type: "number", placeholder: "wk", value: b.week,
          oninput: e => { b.week = e.target.value; } })),
        beats.length > 2 ? el("div", { style: "flex:0 0 34px" },
          el("button", { class: "btn danger", style: "padding:4px 8px", onclick: () => { beats.splice(i, 1); rebuild(); } }, "×")) : null));
      if (i < beats.length - 1) {
        rows.appendChild(el("p", { class: "muted", style: "font-size:10px;margin:2px 0 0 116px" }, `sets ${slugOf()}_${i + 1} ↓`));
      }
    });
  };
  name.addEventListener("input", rebuild);
  rebuild();
  const create = () => {
    // Dedupe the SLUG itself, not just the ids: flags are one global set, so
    // two storylines named alike would otherwise cross-wire (either's beat 1
    // unlocking both beat 2s).
    let slug = slugOf();
    const takenFlags = producibleFlags();
    for (let n = 2; takenFlags.has(`${slug}_1`); n++) slug = `${slugOf()}${n}`;
    const made = [];
    let weekFloor = 0;
    beats.forEach((b, i) => {
      let id = `${b.loc}_${slug}_${i + 1}`, n = 2;
      while (allEvents().some(e => e.id === id) || made.some(m => m.id === id)) id = `${b.loc}_${slug}_${i + 1}_${n++}`;
      const ev = { id, location: b.loc, activities: [],
        text: `[draft] ${b.premise.trim() || "Something happens."}`,
        effect: { text: "[draft] It resolves.", outcome: "[draft] saw it through.",
          ...(i < beats.length - 1 ? { flags: [`${slug}_${i + 1}`] } : {}) } };
      if (i > 0) ev.requires = [`${slug}_${i}`];
      const wk = parseInt(b.week, 10);
      if (wk >= 1 && wk <= 7) {
        // A beat can't fire before the beat it requires: weeks never go backward.
        ev.minWeek = Math.max(wk, weekFloor);
        weekFloor = ev.minWeek;
      }
      made.push(ev);
    });
    made.forEach(ev => locEvents(ev.location).push(ev));
    closeModal();
    // Isolate the new chain on the map, land in edit on beat 1 for prose.
    clearFilters();
    STATE.filters.chain = made.map(m => m.id).sort()[0];
    STATE.loc = made[0].location; STATE.sel = made[0].id; STATE.view = "edit";
    markDirty(); render();
  };
  showModal(el("div", {},
    el("h2", {}, "New storyline"),
    el("div", { class: "row" }, el("div", {}, el("label", {}, "Name (becomes the flag prefix)"), name)),
    el("label", { style: "margin-top:10px" }, "Beats — each unlocks the next, anywhere in town"),
    rows,
    el("div", { style: "margin-top:8px" },
      el("button", { class: "btn", onclick: () => { if (beats.length < 5) { beats.push(blankBeat()); rebuild(); } } }, "+ beat")),
    el("div", { style: "margin-top:14px;display:flex;justify-content:flex-end;gap:8px" },
      el("button", { class: "btn", onclick: closeModal }, "Cancel"),
      el("button", { class: "btn primary", onclick: create }, "Create storyline"))));
  name.focus();
}

// ---- validation (mirror of the build contract) ----
function validate() {
  const errs = [];
  const prod = producibleFlags();
  const allIds = allEvents().map(e => e.id);
  if (new Set(allIds).size !== allIds.length) errs.push("Duplicate event ids");
  const actIds = LOCS.flatMap(l => locActs(l).map(a => a.id));
  if (new Set(actIds).size !== actIds.length) errs.push("Duplicate activity ids");
  const o = STATE.data.origins || {};
  if ((o.roles||[]).length !== 6) errs.push(`needs exactly 6 roles (has ${(o.roles||[]).length})`);
  if ((o.backgrounds||[]).length !== 6) errs.push(`needs exactly 6 backgrounds (has ${(o.backgrounds||[]).length})`);
  for (const orig of [...(o.roles||[]), ...(o.backgrounds||[])]) {
    if (!orig.name || !orig.name.trim()) errs.push(`an origin (${orig.id || "?"}) has no name`);
  }
  for (const loc of LOCS) {
    const n = locActs(loc).length;
    if (n < 2 || n > 4) errs.push(`${locName(loc)}: needs 2–4 activities (has ${n})`);
    const meta = STATE.data.locations[loc].meta;
    if (meta !== undefined) {
      if (typeof meta.name !== "string" || !meta.name.trim()) errs.push(`${loc}: location name must not be empty`);
      if (meta.blurb !== undefined && typeof meta.blurb !== "string") errs.push(`${loc}: location blurb must be text`);
    }
    for (const ev of locEvents(loc)) {
      const shapes = [!!ev.effect, !!ev.check, !!(ev.choices&&ev.choices.length)].filter(Boolean).length;
      if (shapes !== 1) errs.push(`${ev.id}: must be exactly one shape`);
      if (!ev.text || !ev.text.trim()) errs.push(`${ev.id}: empty setup text`);
      const acts = locActs(loc).map(a => a.id);
      (ev.activities||[]).forEach(a => { if (!acts.includes(a)) errs.push(`${ev.id}: unknown activity "${a}"`); });
      if (ev.check && !(ev.check.dc >= 1 && ev.check.dc <= STATE.data.statCap)) errs.push(`${ev.id}: dc out of range`);
      if (ev.weight !== undefined && (!Number.isInteger(ev.weight) || ev.weight < 1)) errs.push(`${ev.id}: weight must be a positive integer`);
      if (ev.minWeek !== undefined && ev.maxWeek !== undefined && ev.minWeek > ev.maxWeek) errs.push(`${ev.id}: earliest week is after latest`);
      if (ev.choices && ev.choices.length) {
        if (ev.choices.length < 2 || ev.choices.length > 3) errs.push(`${ev.id}: needs 2–3 choices (has ${ev.choices.length})`);
        ev.choices.forEach((c, i) => {
          const cid = `${ev.id} choice ${i+1}`;
          if (!c.label || !c.label.trim()) errs.push(`${cid}: empty label`);
          const cShapes = [!!c.effect, !!c.check, !!c.random].filter(Boolean).length;
          if (cShapes !== 1) errs.push(`${cid}: must be exactly one of flat / check / random`);
          if (c.check) {
            if (!STATE.data.stats.includes(c.check.stat)) errs.push(`${cid}: unknown stat "${c.check.stat}"`);
            if (!(c.check.dc >= 1 && c.check.dc <= STATE.data.statCap)) errs.push(`${cid}: dc out of range`);
            if (!c.pass || !c.fail) errs.push(`${cid}: check needs both pass and fail`);
          }
          if (c.random) {
            if (!Array.isArray(c.random) || c.random.length < 2) errs.push(`${cid}: random needs at least 2 outcomes`);
            (Array.isArray(c.random) ? c.random : []).forEach((r, j) => {
              if (!r.effect) errs.push(`${cid}: random outcome ${j+1} has no effect`);
              if (r.weight !== undefined && !(typeof r.weight === "number" && r.weight > 0)) errs.push(`${cid}: random outcome ${j+1} weight must be > 0`);
            });
          }
        });
      }
      for (const b of branchesOf(ev)) {
        if (!b.text || !b.text.trim()) errs.push(`${ev.id}: a branch has empty text`);
        if (!b.outcome || !b.outcome.trim()) errs.push(`${ev.id}: a branch has empty outcome`);
        Object.keys(b.stats || {}).forEach(st => { if (!STATE.data.stats.includes(st)) errs.push(`${ev.id}: unknown stat "${st}" in an effect`); });
        for (const [t, v] of Object.entries(b.threats || {})) {
          if (!THREATS.includes(t)) errs.push(`${ev.id}: unknown threat "${t}"`);
          else if (!Number.isInteger(v) || v === 0 || v < -2 || v > 2) errs.push(`${ev.id}: threat "${t}" delta must be a non-zero integer in -2..+2`);
        }
      }
      (ev.requires||[]).forEach(f => { if (!prod.has(f)) errs.push(`${ev.id}: requires "${f}" — nothing sets it`); });
      (ev.forbids||[]).forEach(f => { if (!prod.has(f)) errs.push(`${ev.id}: forbids "${f}" — never set`); });
    }
  }
  return errs;
}

function markDirty() { STATE.dirty = true; refreshStatus(); }
function refreshStatus() {
  const errs = validate();
  const s = document.getElementById("status");
  const save = document.getElementById("save");
  if (errs.length) { s.className = "err"; s.textContent = `${errs.length} problem${errs.length>1?"s":""}`; save.disabled = true; }
  else { s.className = "ok"; s.textContent = STATE.dirty ? "ready to save" : "all valid"; save.disabled = !STATE.dirty; }
  const stale = document.getElementById("problems");
  if (stale) stale.remove();
  const drafts = draftEvents();
  const d = document.getElementById("drafts");
  if (d) {
    d.style.display = drafts.length ? "" : "none";
    d.textContent = `✎ ${drafts.length} draft${drafts.length > 1 ? "s" : ""}`;
    d.title = "Events still carrying [draft] prose — click to open the next one";
    d.onclick = () => {
      const ev = drafts[0];
      STATE.loc = ev.location; STATE.sel = ev.id; STATE.view = "edit"; render();
    };
  }
}

// ---- MAP view ----

/**
 * Chains derived from the flag graph: connected components over the
 * requires/forbids wiring, excluding "ubiquitous" colour flags (3+ setters
 * across 2+ locations — relic_clue, turned_to_darkness…) which would fuse
 * the whole story into one blob. Zero schema: the wiring IS the chain, so
 * chains can never drift out of date.
 */
function deriveChains() {
  const evs = allEvents();
  const setters = {}, needers = {}, locOf = {};
  for (const ev of evs) {
    locOf[ev.id] = ev.location;
    setterFlags(ev).forEach(f => (setters[f] = setters[f] || []).push(ev.id));
    [...(ev.requires || []), ...(ev.forbids || [])].forEach(f => (needers[f] = needers[f] || []).push(ev.id));
  }
  const ubiquitous = new Set(Object.entries(setters)
    .filter(([f, s]) => s.length >= 3 && new Set(s.map(id => locOf[id])).size >= 2)
    .map(([f]) => f));
  const parent = {};
  const find = x => (parent[x] === x ? x : (parent[x] = find(parent[x])));
  evs.forEach(e => (parent[e.id] = e.id));
  for (const [f, need] of Object.entries(needers)) {
    if (ubiquitous.has(f)) continue;
    const all = [...(setters[f] || []), ...need];
    for (let i = 1; i < all.length; i++) parent[find(all[0])] = find(all[i]);
  }
  const comps = {};
  for (const ev of evs) {
    const root = find(ev.id);
    (comps[root] = comps[root] || []).push(ev);
  }
  return Object.values(comps)
    .filter(c => c.length > 1)
    .map(c => {
      const head = c.find(e => !(e.requires || []).length) || c[0];
      return {
        key: c.map(e => e.id).sort()[0],   // stable while any of the wiring survives
        label: head.id.replace(/_/g, " "),
        ids: new Set(c.map(e => e.id)),
        size: c.length,
      };
    })
    .sort((a, b) => b.size - a.size);
}

function anyFilterActive() {
  const F = STATE.filters;
  return Boolean(F.chain || F.locs.size || F.threat || F.week || F.q.trim());
}

function clearFilters() {
  STATE.filters = { chain: null, locs: new Set(), threat: null, threatMode: "any", week: null, q: "" };
}

function eventMatches(ev, chains) {
  const F = STATE.filters;
  if (F.locs.size && !F.locs.has(ev.location)) return false;
  if (F.chain) {
    const c = chains.find(ch => ch.key === F.chain);
    if (!c || !c.ids.has(ev.id)) return false;
  }
  if (F.week) {
    if (ev.minWeek !== undefined && F.week < ev.minWeek) return false;
    if (ev.maxWeek !== undefined && F.week > ev.maxWeek) return false;
  }
  if (F.threat) {
    const m = threatMarks(ev)[F.threat];
    if (!m) return false;
    if (F.threatMode === "relief" && !m.neg) return false;
    if (F.threatMode === "worsen" && !m.pos) return false;
  }
  const q = F.q.trim().toLowerCase();
  if (q) {
    const hay = [ev.id, ...(ev.requires || []), ...(ev.forbids || []), ...setterFlags(ev),
      ev.text || "", ...branchesOf(ev).flatMap(b => [b.text || "", b.outcome || ""])].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function filterBar() {
  const F = STATE.filters;
  const chains = deriveChains();
  if (F.chain && !chains.some(c => c.key === F.chain)) F.chain = null;
  const bar = el("div", { class: "filterbar" });
  bar.appendChild(el("select", { onchange: e => { F.chain = e.target.value || null; drawMap(); } },
    el("option", { value: "" }, "All chains"),
    ...chains.map(c => el("option", { value: c.key, selected: F.chain === c.key ? true : false }, `${c.label} (${c.size})`))));
  for (const loc of LOCS) {
    bar.appendChild(el("button", {
      class: "fchip" + (F.locs.has(loc) ? " on" : ""),
      onclick: e => {
        if (F.locs.has(loc)) F.locs.delete(loc); else F.locs.add(loc);
        e.target.classList.toggle("on");
        drawMap();
      },
    }, locName(loc)));
  }
  const modeSel = el("select", { style: F.threat ? "" : "display:none", onchange: e => { F.threatMode = e.target.value; drawMap(); } },
    ...[["any", "relief or worsen"], ["relief", "relief only"], ["worsen", "worsen only"]].map(([v, t]) =>
      el("option", { value: v, selected: F.threatMode === v ? true : false }, t)));
  bar.appendChild(el("select", { onchange: e => { F.threat = e.target.value || null; modeSel.style.display = F.threat ? "" : "none"; drawMap(); } },
    el("option", { value: "" }, "Any threat"),
    ...THREATS.map(t => el("option", { value: t, selected: F.threat === t ? true : false }, THREAT_NAMES[t]))));
  bar.appendChild(modeSel);
  bar.appendChild(el("select", { onchange: e => { F.week = parseInt(e.target.value, 10) || null; drawMap(); } },
    el("option", { value: "" }, "Any week"),
    ...[1, 2, 3, 4, 5, 6, 7].map(w => el("option", { value: String(w), selected: F.week === w ? true : false }, `Week ${w}`))));
  // Search updates the SVG only — the bar is never rebuilt mid-keystroke.
  bar.appendChild(el("input", { type: "text", class: "fsearch", placeholder: "search events, flags, prose…", value: F.q,
    oninput: e => { F.q = e.target.value; drawMap(); } }));
  bar.appendChild(el("button", { class: "fchip", onclick: newEventModal }, "+ Event"));
  bar.appendChild(el("button", { class: "fchip", onclick: newStorylineModal }, "+ Storyline"));
  bar.appendChild(el("span", { id: "fcount", class: "muted" }));
  bar.appendChild(el("button", { class: "fchip", id: "fclear", style: "display:none",
    onclick: () => { clearFilters(); render(); } }, "× clear"));
  return bar;
}

function renderMap() {
  const view = document.getElementById("view");
  view.innerHTML = "";
  view.appendChild(filterBar());
  view.appendChild(el("div", { id: "inspector" }));
  view.appendChild(el("div", { id: "map-wrap" }));
  setInspector(null);
  drawMap();
}

/** The inspector strip above the map: the hovered node's details, spelled
 * out in words instead of a cryptic sub-line and a hover tooltip. */
function setInspector(ev) {
  const box = document.getElementById("inspector");
  if (!box) return;
  box.innerHTML = "";
  if (!ev) {
    box.appendChild(el("div", { class: "muted", style: "padding-top:7px" },
      "Hover an event for its full details · click = edit · alt-click = isolate its chain · esc = clear filters"));
    return;
  }
  const shape = shapeOf(ev);
  const head = [
    shape === "choices" ? `choice of ${ev.choices.length}`
      : shape === "check" ? `hidden ${ev.check.stat} check (dc ${ev.check.dc})`
      : "flat outcome",
    (ev.minWeek !== undefined || ev.maxWeek !== undefined) ? `weeks ${ev.minWeek ?? 1}–${ev.maxWeek ?? 7}` : "any week",
    ev.weight !== undefined ? `weight ${ev.weight}` : null,
    ev.repeatable ? "repeatable" : null,
    (ev.activities || []).length ? `via ${ev.activities.join(", ")}` : "any activity here",
  ].filter(Boolean).join(" · ");
  box.appendChild(el("div", {},
    el("span", { style: "color:var(--p100);font-weight:600" }, (isDraft(ev) ? "✎ " : "") + ev.id),
    el("span", { class: "muted" }, `   ${head}`)));
  const line = el("div", { style: "margin-top:2px" });
  const addFlags = (label, flags) => {
    if (!flags.length) return;
    line.appendChild(el("span", { class: "muted" }, (line.childNodes.length ? "  ·  " : "") + label + " "));
    line.appendChild(el("span", { class: "flag" }, flags.join(", ")));
  };
  addFlags("needs", ev.requires || []);
  addFlags("not if", ev.forbids || []);
  addFlags("sets", setterFlags(ev));
  if (!line.childNodes.length) line.appendChild(el("span", { class: "muted" }, "no flag wiring"));
  for (const [t, m] of Object.entries(threatMarks(ev))) {
    if (m.neg) { line.appendChild(el("span", { class: "muted" }, "  ·  ")); line.appendChild(el("span", { class: "neg" }, `${THREAT_NAMES[t]} ${m.neg}`)); }
    if (m.pos) { line.appendChild(el("span", { class: "muted" }, "  ·  ")); line.appendChild(el("span", { class: "pos" }, `${THREAT_NAMES[t]} +${m.pos}`)); }
  }
  const prose = (ev.text || "").replace(/\s+/g, " ");
  line.appendChild(el("span", { class: "prose" }, `  —  “${prose.slice(0, 96)}${prose.length > 96 ? "…" : ""}”`));
  box.appendChild(line);
}

function drawMap() {
  const chains = deriveChains();
  const active = anyFilterActive();
  const matched = new Set();
  for (const ev of allEvents()) if (!active || eventMatches(ev, chains)) matched.add(ev.id);

  const fcount = document.getElementById("fcount");
  const fclear = document.getElementById("fclear");
  if (fcount) {
    if (active) {
      // What the filtered set contributes to the doom economy.
      const contrib = THREATS.map(t => {
        let neg = 0, pos = 0;
        for (const ev of allEvents()) {
          if (!matched.has(ev.id)) continue;
          const m = threatMarks(ev)[t];
          if (m) { neg += m.neg; pos += m.pos; }
        }
        return neg || pos ? `${THREAT_NAMES[t]} ${[neg ? String(neg) : null, pos ? `+${pos}` : null].filter(Boolean).join("/")}` : null;
      }).filter(Boolean).join(" · ");
      fcount.textContent = `${matched.size} of ${allEvents().length}` + (contrib ? ` · ${contrib}` : "");
    } else {
      fcount.textContent = "";
    }
    if (fclear) fclear.style.display = active ? "" : "none";
  }

  const colW = 210, nodeW = 168, nodeH = 42, vGap = 10, top = 44, padL = 20;
  const positions = {}; // eventId -> {x,y,cx of right, lx of left}
  let maxRows = 0;
  LOCS.forEach((loc, ci) => {
    const x = padL + ci * colW;
    locEvents(loc).forEach((ev, ri) => {
      const y = top + ri * (nodeH + vGap);
      positions[ev.id] = { x, y, loc };
    });
    maxRows = Math.max(maxRows, locEvents(loc).length);
  });
  const width = padL + LOCS.length * colW;
  const height = top + maxRows * (nodeH + vGap) + 30;

  const edges = [];
  for (const ev of allEvents()) {
    for (const f of (ev.requires||[])) {
      for (const setter of allEvents()) {
        if (setter.id !== ev.id && setterFlags(setter).includes(f)) edges.push({ from: setter.id, to: ev.id, flag: f, kind: "req" });
      }
    }
    for (const f of (ev.forbids||[])) {
      for (const setter of allEvents()) {
        if (setter.id !== ev.id && setterFlags(setter).includes(f)) edges.push({ from: setter.id, to: ev.id, flag: f, kind: "forbid" });
      }
    }
  }

  const edgeEls = edges.map(e => {
    const a = positions[e.from], b = positions[e.to];
    if (!a || !b) return null;
    // Edges vanish unless both ends match: dropping half-edges is what
    // actually kills the hairball when a filter is on.
    if (!matched.has(e.from) || !matched.has(e.to)) return null;
    let d;
    if (a.loc === b.loc) {
      // Same column: loop out of the column's left side instead of
      // cutting a backwards curve through the nodes.
      const x1 = a.x, y1 = a.y + nodeH/2, x2 = b.x, y2 = b.y + nodeH/2;
      d = `M ${x1} ${y1} C ${x1 - 38} ${y1}, ${x2 - 38} ${y2}, ${x2} ${y2}`;
    } else {
      const x1 = a.x + nodeW, y1 = a.y + nodeH/2, x2 = b.x, y2 = b.y + nodeH/2;
      const mx = (x1 + x2) / 2;
      d = `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
    }
    const p = svg("path", {
      d,
      fill: "none", stroke: e.kind === "forbid" ? "var(--red)" : "var(--gold)",
      "stroke-width": 1.5, "stroke-dasharray": e.kind === "forbid" ? "5 4" : "none",
      opacity: 0.55,
    });
    p.appendChild(svg("title", {}, `${e.from} —${e.kind === "forbid" ? " blocks" : " unlocks"}→ ${e.to}  (${e.flag})`));
    return p;
  }).filter(Boolean);

  const heads = LOCS.map((loc, ci) =>
    svg("text", { class: "col-head", x: padL + ci*colW + nodeW/2, y: 24, "text-anchor": "middle" }, locName(loc)));

  const nodes = allEvents().map(ev => {
    const p = positions[ev.id];
    // Title: the column already names the location, so strip the id's
    // prefix and read the rest as words.
    let title = ev.id.startsWith(ev.location + "_") ? ev.id.slice(ev.location.length + 1) : ev.id;
    title = (isDraft(ev) ? "✎ " : "") + title.replace(/_/g, " ");
    if (title.length > 27) title = title.slice(0, 26) + "…";
    // Badge row: shape · week gate · repeatable · threat deltas — the same
    // vocabulary as the Edit list. Wiring lives in the edges + inspector.
    const badges = [];
    const shape = shapeOf(ev);
    badges.push(shape === "choices" ? ["choice", "sv-gold"] : shape === "check" ? ["check", "sv-blue"] : ["flat", "sv-green"]);
    if (ev.minWeek !== undefined || ev.maxWeek !== undefined) {
      badges.push([`wk${ev.minWeek ?? 1}${(ev.maxWeek ?? 7) !== 7 ? "–" + ev.maxWeek : "+"}`, "sv-dim"]);
    }
    if (ev.repeatable) badges.push(["↻", "sv-dim"]);
    for (const [t, m] of Object.entries(threatMarks(ev))) {
      if (m.neg) badges.push([`${THREAT_NAMES[t][0]}${m.neg}`, "sv-neg"]);
      if (m.pos) badges.push([`${THREAT_NAMES[t][0]}+${m.pos}`, "sv-pos"]);
    }
    let bx = 8;
    const badgeEls = badges.map(([t, cls]) => {
      const b = svg("text", { class: "bdg " + cls, x: bx, y: 32 }, t);
      bx += t.length * 5.6 + 8;
      return b;
    });
    const g = svg("g", {
      class: "node" + (STATE.sel === ev.id ? " sel" : "") + (matched.has(ev.id) ? "" : " dim") + (isDraft(ev) ? " draft" : ""),
      transform: `translate(${p.x},${p.y})`,
      onmouseenter: () => setInspector(ev),
      onclick: (e) => {
        if (e.altKey) {
          // Alt-click: isolate this event's whole chain (plain click edits).
          const c = chains.find(ch => ch.ids.has(ev.id));
          if (c) { STATE.filters.chain = c.key; render(); }
          return;
        }
        STATE.sel = ev.id; STATE.loc = p.loc; STATE.view = "edit"; render();
      },
    },
      svg("rect", { width: nodeW, height: nodeH }),
      svg("text", { x: 8, y: 16 }, title),
      ...badgeEls,
    );
    return g;
  });

  const wrap = document.getElementById("map-wrap");
  if (!wrap) return;
  wrap.innerHTML = "";
  wrap.appendChild(svg("svg", { width, height, viewBox: `0 0 ${width} ${height}`, style: `width:${width}px;height:${height}px` },
    ...edgeEls, ...heads, ...nodes));
}

// ---- EDIT view ----
function effectEditor(effect, onChange, title) {
  effect.stats = effect.stats || {};
  const statInputs = STATE.data.stats.map(stat =>
    el("div", {},
      el("label", {}, stat.slice(0,4)),
      el("input", { type: "number", value: effect.stats[stat] ?? 0, oninput: e => {
        const v = parseInt(e.target.value, 10) || 0;
        if (v === 0) delete effect.stats[stat]; else effect.stats[stat] = v;
        markDirty();
      }})));
  return el("div", { class: "branch" },
    title ? el("h3", {}, title) : null,
    el("label", {}, "Prose shown to the player"),
    el("textarea", { oninput: e => { effect.text = e.target.value; markDirty(); } }, effect.text || ""),
    el("label", {}, "Outcome (host line: “<name> <outcome>”)"),

function flagPicker(current, onChange, opts = {}) {
  const prod = producibleFlags();

  const filter = el("input", { type: "text", placeholder: `filter ${allFlags().length} flags…`, style: "margin-bottom:5px;font-size:12px" });
  const fill = () => {
    box.innerHTML = "";
    const q = filter.value.trim().toLowerCase();
    // Ticked flags float to the top so the current wiring is visible at a glance.
    const flags = allFlags()
      .filter(f => !q || f.includes(q))
      .sort((a, b) => (current.includes(b) ? 1 : 0) - (current.includes(a) ? 1 : 0) || a.localeCompare(b));
    for (const f of flags) box.appendChild(el("label", {},
      el("input", { type: "checkbox", checked: current.includes(f) ? true : false, onchange: e => {

      prod.has(f) ? null : el("span", { class: "err", style: "font-size:10px" }, " ⚠ nothing sets this")));
    if (!flags.length) box.appendChild(el("span", { class: "muted" }, q ? "no flags match" : "no flags yet"));

  filter.addEventListener("input", fill);

  return el("div", {}, filter, box, add);
}

/** The tuning dashboard for the four threat tracks: how much relief and
 * aggravation the whole story offers (best/worst case per event), and this
 * location's share. Each track climbs +13 over the week against a cap of
 * 10, so the party needs −3 net per track to save it. */
function threatBudgetPanel() {
  const rows = THREATS.map(t => {
    let relief = 0, worsen = 0, locRelief = 0, locWorsen = 0;
    for (const loc of LOCS) for (const ev of locEvents(loc)) {
      const m = threatMarks(ev)[t];
      if (!m) continue;
      relief += m.neg; worsen += m.pos;
      if (loc === STATE.loc) { locRelief += m.neg; locWorsen += m.pos; }
    }
    return { t, relief, worsen, locRelief, locWorsen };
  });
  const cell = (v, cls) => el("td", { class: v ? cls : "muted" }, v ? (v > 0 ? `+${v}` : String(v)) : "·");
  return el("div", { class: "panel", style: "margin-top:12px" },
    el("h2", {}, "Threat budget"),
    el("table", { class: "budget" },
      el("tr", {}, el("th", {}, ""), el("th", {}, "relief"), el("th", {}, "worsen"), el("th", {}, "here")),
      ...rows.map(r => el("tr", {},
        el("td", {}, THREAT_NAMES[r.t]),
        cell(r.relief, "neg"),
        cell(r.worsen, "pos"),
        el("td", {}, r.locRelief || r.locWorsen
          ? [r.locRelief ? el("span", { class: "neg" }, String(r.locRelief)) : null,
             r.locRelief && r.locWorsen ? " / " : null,
             r.locWorsen ? el("span", { class: "pos" }, `+${r.locWorsen}`) : null]
          : el("span", { class: "muted" }, "·")),
      ))),
    el("p", { class: "muted", style: "font-size:11px;margin:8px 0 0" },
      "Each track climbs +13 over the week (cap 10): the party needs −3 net per track to save it. Relief/worsen sum each event's best and worst branch."));
}

/** One line summarising everything about WHEN an event fires — shown on the
 * collapsed disclosure so the writing surface stays calm. */
function gateSummary(ev) {
  const bits = [];
  if (ev.requires && ev.requires.length) bits.push(`needs ${ev.requires.join(", ")}`);
  if (ev.forbids && ev.forbids.length) bits.push(`not if ${ev.forbids.join(", ")}`);
  if (ev.minWeek !== undefined || ev.maxWeek !== undefined) bits.push(`wk ${ev.minWeek ?? 1}–${ev.maxWeek ?? 7}`);
  if (ev.weight !== undefined) bits.push(`weight ${ev.weight}`);
  if (ev.repeatable) bits.push("repeatable");
  bits.push((ev.activities || []).length
    ? `${ev.activities.length} of ${locActs(STATE.loc).length} activities`
    : "any activity");
  return bits.join(" · ");
}

function duplicateEvent(ev) {
  const copy = JSON.parse(JSON.stringify(ev));
  let id = `${ev.id}_copy`, n = 2;
  while (allEvents().some(e => e.id === id)) id = `${ev.id}_copy${n++}`;
  copy.id = id;
  locEvents(STATE.loc).push(copy);
  STATE.sel = id; markDirty(); render();
}

function setShape(ev, shape) {
  delete ev.effect; delete ev.check; delete ev.pass; delete ev.fail; delete ev.choices;
  if (shape === "effect") ev.effect = { text: "", outcome: "" };
  else if (shape === "check") { ev.check = { stat: "will", dc: 4 }; ev.pass = { text: "", outcome: "" }; ev.fail = { text: "", outcome: "" }; }
  else ev.choices = [{ label: "Option one", effect: { text: "", outcome: "" } }, { label: "Option two", effect: { text: "", outcome: "" } }];
}

function setChoiceShape(c, shape) {
  delete c.effect; delete c.check; delete c.pass; delete c.fail; delete c.random;
  if (shape === "effect") c.effect = { text: "", outcome: "" };
  else if (shape === "check") { c.check = { stat: "will", dc: 4 }; c.pass = { text: "", outcome: "" }; c.fail = { text: "", outcome: "" }; }
  else c.random = [{ weight: 1, effect: { text: "", outcome: "" } }, { weight: 1, effect: { text: "", outcome: "" } }];
}

function connectionsPanel(ev) {
  const p = el("div", { class: "panel conn" }, el("h2", {}, "Connections"));
  if (!ev) { p.appendChild(el("p", { class: "muted" }, "—")); return p; }
  const sets = setterFlags(ev);
  // what this unlocks
  if (sets.length) {
    sets.forEach(flag => {
      const needers = allEvents().filter(e => (e.requires||[]).includes(flag) && e.id !== ev.id);
      const blockers = allEvents().filter(e => (e.forbids||[]).includes(flag) && e.id !== ev.id);
      p.appendChild(el("div", {}, "sets ", el("span", { class: "flag" }, flag)));
      p.appendChild(el("ul", {},
        ...needers.map(n => el("li", {}, "→ unlocks ", n.id)),
        ...blockers.map(b => el("li", {}, "⊘ blocks ", b.id)),
        (!needers.length && !blockers.length) ? el("li", { class: "muted" }, "nothing needs this yet") : null,
      ));
    });
  }
  // what unlocks this
  (ev.requires||[]).forEach(flag => {
    const setters = allEvents().filter(e => setterFlags(e).includes(flag));
    p.appendChild(el("div", {}, "needs ", el("span", { class: "flag" }, flag)));
    p.appendChild(el("ul", {}, ...(setters.length ? setters.map(s => el("li", {}, "← from ", s.id)) : [el("li", { class: "err" }, "nothing sets this!")])));
  });
  if (!sets.length && !(ev.requires||[]).length) p.appendChild(el("p", { class: "muted" }, "No connections. Set a flag (in an outcome) or add a requirement to wire this into the week."));
  return p;
}

/** The header's "N problems" click-through: every row jumps to its event. */
function toggleProblems() {
  const existing = document.getElementById("problems");
  if (existing) { existing.remove(); return; }
  const errs = validate();
  if (!errs.length) return;
  const panel = el("div", { id: "problems" }, ...errs.map(msg => {
    const prefix = msg.split(":")[0].trim();
    // "<id> choice 2: …" rows point at their event; "<location>: …" rows
    // open that location; plain-id rows jump straight to the event.
    const ev = allEvents().find(e => e.id === prefix)
      || allEvents().find(e => e.id === prefix.replace(/ choice \d+$/, ""));
    const loc = !ev && LOCS.includes(prefix) ? prefix : null;
    return el("div", { onclick: () => {
      panel.remove();
      if (ev) { STATE.loc = ev.location; STATE.sel = ev.id; STATE.view = "edit"; render(); }
      else if (loc) { STATE.loc = loc; STATE.sel = null; STATE.view = "edit"; render(); }
    } }, msg);
  }));
  document.body.appendChild(panel);
}

function deleteEvent(ev) {
  const arr = locEvents(STATE.loc);
  const i = arr.findIndex(e => e.id === ev.id);
  if (i >= 0) arr.splice(i, 1);
  STATE.sel = null; markDirty(); render();
}

}

function renderOrigins() {
  const view = document.getElementById("view");
  view.innerHTML = "";
  const o = STATE.data.origins;
  const roles = el("div", { class: "panel" }, el("h2", {}, "Roles (the calling — bigger stat shaper)"),
    ...o.roles.map(r => originCard(r, true)));
  const bgs = el("div", { class: "panel" }, el("h2", {}, "Backgrounds (where they came from)"),
    ...o.backgrounds.map(b => originCard(b, false)));
  view.appendChild(el("div", {},
    el("p", { class: "muted", style: "margin:0 0 10px" },
      "Players pick one role × one background; base stats = floor of 1 + these bonuses. A starting flag is carried into the week (and can gate events)."),
    el("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start" }, roles, bgs),
  ));
}

// ---- shell ----
function render() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === STATE.view));
  if (STATE.view === "map") renderMap();
  else if (STATE.view === "origins") renderOrigins();
  else renderEdit();
  refreshStatus();
}

/** Drop empty containers the form editors create as a side effect
 * ({stats:{}}, {threats:{}}, flags:[]), so saves never churn the JSON. */
function cleanupData() {
  for (const loc of LOCS) {
    // A meta block with nothing in it is form residue, not content.
    const meta = STATE.data.locations[loc].meta;
    if (meta && !(meta.name && meta.name.trim()) && !(meta.blurb && meta.blurb.trim())) {
      delete STATE.data.locations[loc].meta;
    }
    for (const ev of locEvents(loc)) {
      for (const b of branchesOf(ev)) {
        if (b.stats && !Object.keys(b.stats).length) delete b.stats;
        if (b.threats && !Object.keys(b.threats).length) delete b.threats;
        if (b.flags && !b.flags.length) delete b.flags;
      }
    }
  }
  const o = STATE.data.origins || {};
  for (const orig of [...(o.roles||[]), ...(o.backgrounds||[])]) {
    if (orig.bonus && !Object.keys(orig.bonus).length) delete orig.bonus;
  }
}

async function save() {
  cleanupData();
  // The editor never edits storylines, so it never SENDS them — otherwise a
  // stale tab's copy would clobber whatever the Scribe registered since it
  // loaded. The server validates against the on-disk registry regardless.
  const res = await fetch("/api/content", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ locations: STATE.data.locations, origins: STATE.data.origins }) });
  const body = await res.json();
  const s = document.getElementById("status");
  if (res.ok) {
    STATE.dirty = false; s.className = "ok"; s.textContent = "saved ✓";
    document.getElementById("save").disabled = true;
    loadBackups();
  } else {
    s.className = "err";
    s.textContent = body.errors
      ? body.errors.slice(0, 3).join(" · ") + (body.errors.length > 3 ? ` · +${body.errors.length - 3} more` : "")
      : body.error || "save failed";
  }
}

async function loadBackups() {
  try {
    const res = await fetch("/api/backups");
    const { backups } = await res.json();
    const wrap = document.getElementById("backup-wrap");
    const sel = document.getElementById("backup-list");
    sel.innerHTML = "";
    for (const b of backups) sel.appendChild(el("option", { value: b }, b.replace("T", "  ")));
    wrap.style.display = backups.length ? "inline-flex" : "none";
  } catch { /* backups are a convenience — never block the editor on them */ }
}

async function restore() {
  const id = document.getElementById("backup-list").value;
  if (!id) return;
  if (!confirm(`Restore snapshot ${id}?\n\nThe current files are backed up first, so this is undoable.`)) return;
  const res = await fetch("/api/restore", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id }) });
  const s = document.getElementById("status");
  if (res.ok) {
    STATE.data = await res.json();
    STATE.dirty = false; STATE.sel = null;
    s.className = "ok"; s.textContent = "restored ✓";
    render(); loadBackups();
  } else {
    const body = await res.json().catch(() => ({}));
    s.className = "err"; s.textContent = body.error || "restore failed";
  }
}

async function load() {
  try {
    const res = await fetch("/api/content");
    if (!res.ok) throw new Error(`server said ${res.status}`);
    STATE.data = await res.json();
  } catch (err) {
    document.getElementById("view").appendChild(el("div", { class: "panel", style: "margin:40px auto;max-width:480px;text-align:center" },
      el("h2", {}, "Couldn't load the story"),
      el("p", { class: "err" }, String(err.message || err)),
      el("p", { class: "muted" }, "Is the editor server still running? Restart with npm run editor, then reload this page.")));
    return;
  }
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { STATE.view = t.dataset.view; render(); }));
  document.getElementById("save").addEventListener("click", save);
  document.getElementById("restore").addEventListener("click", restore);
  document.getElementById("status").addEventListener("click", toggleProblems);
  window.addEventListener("beforeunload", e => {
    if (STATE.dirty) { e.preventDefault(); e.returnValue = ""; }
  });
  window.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") {
      e.preventDefault();
      if (!document.getElementById("save").disabled) save();
    }
    if (e.key === "Escape") {
      if (document.getElementById("overlay")) { closeModal(); return; }
      if (STATE.view === "map" && anyFilterActive()) { clearFilters(); render(); }
    }
  });
  loadBackups();
  render();
}
load();
</script>
</body>
</html>
